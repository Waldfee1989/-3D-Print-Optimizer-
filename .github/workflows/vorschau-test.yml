name: 3D-Vorschau pruefen

on:
  workflow_dispatch:
  push:
    branches:
      - 3d-vorschau-test
      - larger-model-imports
      - in-app-updates
      - filament-scan
      - material-advice
      - project-optimizer
      - simpler-app
      - model-tools
    paths:
      - 'lib/**'
      - 'native/**'
      - 'scripts/configure_android_geometry.py'
      - 'scripts/android_geometry/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/vorschau-test.yml'

permissions:
  contents: read

jobs:
  preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tests fuer diesen Lauf bereitstellen
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('pubspec.yaml')
          text = p.read_text()
          if '\ndev_dependencies:' not in text:
              p.write_text(text + '\ndev_dependencies:\n  flutter_test:\n    sdk: flutter\n')
          elif '\n  flutter_test:' not in text:
              raise SystemExit('flutter_test bitte in dev_dependencies ergaenzen.')
          PYTHON
          mkdir -p test/preview_ci
          cat > test/preview_ci/mesh_renderer_test.dart <<'DART'
          import 'dart:typed_data';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:print_optimizer/mesh_renderer.dart';

          Uint8List render(List<double> vertices, {double zoom = 1, double angleY = 0}) =>
              renderMesh(
                MeshRenderRequest(
                  Float32List.fromList(vertices),
                  100,
                  100,
                  0,
                  angleY,
                  zoom,
                ),
              );

          List<int> pixel(Uint8List image, int x, int y) =>
              image.sublist((y * 100 + x) * 4, (y * 100 + x + 1) * 4);

          void main() {
            const a = [-.8, -.8, -.4, .8, -.8, .4, 0.0, .8, 0.0];
            const b = [-.8, -.8, .4, .8, -.8, -.4, 0.0, .8, 0.0];

            test('Filled interiors and transparent background', () {
              final image = render(a);
              expect(pixel(image, 50, 50)[3], 255);
              expect(pixel(image, 0, 0)[3], 0);
            });

            test(
              'Intersecting faces use per-pixel depth independently of file order',
              () {
                final combined = render([...a, ...b]);
                expect(combined, orderedEquals(render([...b, ...a])));
                expect(pixel(combined, 40, 60), pixel(render(b), 40, 60));
                expect(pixel(combined, 60, 60), pixel(render(a), 60, 60));
                expect(pixel(render(a), 40, 60), isNot(pixel(render(b), 40, 60)));
              },
            );

            test('Adjacent faces cover a square without seams', () {
              final image = render([
                -.8,
                -.8,
                0,
                .8,
                -.8,
                0,
                .8,
                .8,
                0,
                -.8,
                -.8,
                0,
                .8,
                .8,
                0,
                -.8,
                .8,
                0,
              ]);
              for (var y = 17; y < 83; y++) {
                for (var x = 17; x < 83; x++) {
                  expect(pixel(image, x, y)[3], 255, reason: 'Gap at $x,$y');
                }
              }
            });

            test('Reverse winding remains visible', () {
              expect(
                render(a),
                orderedEquals(
                  render([...a.sublist(6, 9), ...a.sublist(3, 6), ...a.sublist(0, 3)]),
                ),
              );
            });

            test('Zoom increases coverage and rotation changes the image', () {
              int covered(Uint8List image) {
                var count = 0;
                for (var i = 3; i < image.length; i += 4) {
                  if (image[i] != 0) count++;
                }
                return count;
              }

              expect(covered(render(a, zoom: 2)), greaterThan(covered(render(a))));
              expect(render(a, angleY: 45), isNot(orderedEquals(render(a))));
              expect(render(a, zoom: 5).length, 100 * 100 * 4);
            });

            test('Degenerate and offscreen faces are safe', () {
              expect(render(List.filled(9, 0)), everyElement(0));
              expect(render([10, 10, 0, 11, 10, 0, 10, 11, 0]), everyElement(0));
            });

            test('Faces beyond the old 3500 limit are rendered', () {
              final image = render([
                for (var i = 0; i < 4000; i++) ...List<double>.filled(9, 0),
                ...a,
              ]);
              expect(pixel(image, 50, 50)[3], 255);
            });
          }
          DART
          cat > test/preview_ci/model_preview_test.dart <<'DART'
          import 'dart:convert';
          import 'dart:typed_data';

          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:print_optimizer/main.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:print_optimizer/project_optimizer.dart';
          import '../scroll_helpers.dart';

          class _Picker extends FilePicker {
            Uint8List? saved;
            @override
            Future<String?> saveFile({String? dialogTitle,String? fileName,String? initialDirectory,
              FileType type = FileType.any,List<String>? allowedExtensions,Uint8List? bytes,bool lockParentWindow = false}) async {
              saved = bytes; return null;
            }

            _Picker({this.paddingBytes = 0, this.reportedSize});
            final int paddingBytes;
            final int? reportedSize;
            @override
            Future<FilePickerResult?> pickFiles({
              String? dialogTitle,
              String? initialDirectory,
              FileType type = FileType.any,
              List<String>? allowedExtensions,
              Function(FilePickerStatus)? onFileLoading,
              bool allowCompression = true,
              int compressionQuality = 30,
              bool allowMultiple = false,
              bool withData = false,
              bool withReadStream = false,
              bool lockParentWindow = false,
              bool readSequential = false,
            }) async {
              final small = utf8.encode(
                'solid test\n'
                'facet normal 0 0 1\nouter loop\n'
                'vertex 0 0 0\nvertex 20 0 0\nvertex 0 20 0\n'
                'endloop\nendfacet\nendsolid test',
              );
              final bytes = Uint8List(paddingBytes > small.length ? paddingBytes : small.length)
                ..fillRange(0, paddingBytes > small.length ? paddingBytes : small.length, 32)
                ..setRange(0, small.length, small);
              return FilePickerResult([
                PlatformFile(name: 'test.stl', size: reportedSize ?? bytes.length, bytes: bytes),
              ]);
            }
          }

          Future<void> loadModel(WidgetTester tester, {_Picker? picker}) async {
            FilePicker.platform = picker ?? _Picker();
            await tester.pumpWidget(const MaterialApp(home: ModelPreviewPage()));
            await tester.tap(find.text('STL / 3MF auswählen'));
            // compute runs on a real isolate, outside the widget test's fake clock.
            for (var attempt = 0; attempt < 200; attempt++) {
              await tester.runAsync(() => Future<void>.delayed(const Duration(milliseconds: 50)));
              await tester.pump();
              if (find.text('test.stl').evaluate().isNotEmpty) break;
            }
            expect(find.text('test.stl'), findsOneWidget);
          }

          void main() {
            testWidgets('Loaded model leads through questions to a saved recommendation', (tester) async {
              SharedPreferences.setMockInitialValues({});
              await loadModel(tester);
              await tester.tap(find.text('OK'));
              await tester.pumpAndSettle();
              expect(find.text('Was ist dir wichtig?'), findsOneWidget);
              expect(find.text('test.stl'), findsOneWidget);
              await tester.tap(find.text('Mechanisches Teil / Gebrauchsteil'));
              await tester.tap(find.text('Speichern'));
              await tester.pumpAndSettle();
              expect(find.text('Filament: PETG'), findsOneWidget);
              expect((await loadPrintProjects()).single.fileName, 'test.stl');
              await tester.pumpWidget(const SizedBox());
            });

            testWidgets('Scaling changes actual saved STL dimensions and keeps original picker data', (tester) async {
              final picker = _Picker();
              await loadModel(tester,picker: picker);
              await reveal(tester,find.text('Größe in %'));
              await tester.tap(find.text('Größe in %'));
              await tester.pumpAndSettle();
              await tester.enterText(find.byType(TextFormField),'200');
              await tester.tap(find.text('Übernehmen'));
              await tester.pumpAndSettle();
              await reveal(tester,find.text('Größe: 200.0 %'));
              await tester.tap(find.text('Datei speichern'));
              for (var i = 0; i < 100 && picker.saved == null; i++) {
                await tester.runAsync(() => Future<void>.delayed(const Duration(milliseconds: 20)));
                await tester.pump();
              }
              expect(picker.saved,isNotNull);
              final data = ByteData.sublistView(picker.saved!);
              var minX = double.infinity,maxX = double.negativeInfinity;
              for (var k = 0; k < 3; k++) {
                final x = data.getFloat32(84+12+k*12,Endian.little);
                if (x < minX) minX = x; if (x > maxX) maxX = x;
              }
              expect(maxX-minX,closeTo(40,0.001));
              expect(tester.takeException(),isNull);
              await tester.pumpWidget(const SizedBox());
            });

            testWidgets('Imports STL larger than the old 30 MB limit', (tester) async {
              await loadModel(tester, picker: _Picker(paddingBytes: 31 * 1024 * 1024));
              final scroll = tester.state<ScrollableState>(find.byType(Scrollable));
              scroll.position.jumpTo(scroll.position.maxScrollExtent);
              await tester.pump();
              expect(find.text('Dreiecke: 1'), findsOneWidget);
              expect(tester.takeException(), isNull);
              await tester.pumpWidget(const SizedBox());
            });

            testWidgets('Rejects files above 100 MB before parsing', (tester) async {
              FilePicker.platform = _Picker(reportedSize: 101 * 1024 * 1024);
              await tester.pumpWidget(const MaterialApp(home: ModelPreviewPage()));
              await tester.tap(find.text('STL / 3MF auswählen'));
              await tester.pump();
              expect(find.textContaining('größer als 100 MB'), findsOneWidget);
              expect(find.text('test.stl'), findsNothing);
              expect(tester.takeException(), isNull);
              await tester.pumpWidget(const SizedBox());
            });

            testWidgets('One finger rotates horizontally and vertically inside the list', (
              tester,
            ) async {
              await loadModel(tester);
              // The render worker may still be running; gestures use the preview bounds.
              final area = find.byType(ClipRRect).first;
              await tester.drag(area, const Offset(60, 0));
              await tester.pump();
              expect(find.textContaining('Horizontal drehen:'), findsOneWidget);
              expect(find.text('Horizontal drehen: 30°'), findsNothing);
              await tester.drag(area, const Offset(0, 60));
              await tester.pump();
              final scroll = tester.state<ScrollableState>(find.byType(Scrollable));
              await reveal(tester,find.textContaining('Vertikal drehen:'));
              expect(find.textContaining('Vertikal drehen:'), findsOneWidget);
              expect(find.text('Vertikal drehen: 25°'), findsNothing);
              scroll.position.jumpTo(0);
              await tester.pump();
              expect(find.text('Zoom: 100 %'), findsOneWidget);
              expect(tester.takeException(), isNull);
              // Disposing while rendering must not update disposed state.
              await tester.pumpWidget(const SizedBox());
              await tester.runAsync(() async {
                await Future<void>.delayed(const Duration(milliseconds: 150));
              });
              expect(tester.takeException(), isNull);
            });

            testWidgets('Two fingers zoom; reset restores zoom and both angles', (
              tester,
            ) async {
              await loadModel(tester);
              final center = tester.getCenter(find.byType(ClipRRect).first);
              final first = await tester.startGesture(
                center - const Offset(30, 0),
                pointer: 1,
              );
              final second = await tester.startGesture(
                center + const Offset(30, 0),
                pointer: 2,
              );
              await first.moveTo(center - const Offset(65, 0));
              await second.moveTo(center + const Offset(65, 0));
              await tester.pump();
              await first.moveTo(center - const Offset(90, 0));
              await second.moveTo(center + const Offset(90, 0));
              await tester.pump();
              await first.up();
              await second.up();
              expect(find.text('Zoom: 100 %'), findsNothing);
              // Lazy ListView children must be built before ensureVisible can find them.
              final scroll = tester.state<ScrollableState>(find.byType(Scrollable));
              await reveal(tester,find.text('Ansicht zurücksetzen'));
              await tester.tap(find.text('Ansicht zurücksetzen'));
              await tester.pump();
              await reveal(tester,find.text('Horizontal drehen: 30°'));
              expect(find.text('Horizontal drehen: 30°'), findsOneWidget);
              await reveal(tester,find.text('Vertikal drehen: 25°'));
              expect(find.text('Vertikal drehen: 25°'), findsOneWidget);
              scroll.position.jumpTo(0);
              await tester.pump();
              expect(find.text('Zoom: 100 %'), findsOneWidget);
              await tester.pumpWidget(const SizedBox());
            });
          }
          DART

      - name: Abhaengigkeiten laden
        run: flutter pub get

      - name: Statische Pruefung
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Oberflaechen und Touch-Gesten testen
        shell: bash
        run: flutter test test --reporter expanded 2>&1 | tee preview-tests.log

      - name: Fehlerdetails bereitstellen
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          log = Path('preview-tests.log')
          if log.exists():
              message = log.read_text(errors='replace')[-16000:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Vorschau-Testdetails::' + message)


  native-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native Geometrie bauen
        run: cmake -S native/model_geometry -B build/native_geometry -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native_geometry --parallel 2
      - name: Geschlossene Schnitte und Zapfen testen
        run: ctest --test-dir build/native_geometry --output-on-failure
      - name: Android-Einrichtung pruefen
        run: python3 -m unittest discover -s scripts/tests -v
