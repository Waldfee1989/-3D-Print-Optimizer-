
name: Android APK erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android-Projekt erstellen
        run: flutter create . --platforms=android

      - name: Kamera-Berechtigung eintragen
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: APK erstellen
        run: flutter build apk --release

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Optimizer-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          
