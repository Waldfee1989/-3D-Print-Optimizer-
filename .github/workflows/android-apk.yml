
name: Android APK erstellen

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - in-app-updates

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Signierungslogik testen
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erstellen
        run: flutter create . --platforms=android

      - name: Android-Updateinstallation einrichten
        run: python3 scripts/configure_android_updates.py

      - name: Feste Android-Signierung einrichten
        env:
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: python3 scripts/configure_android_signing.py

      - name: Android SDK 36 einstellen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          if not p.exists():
              raise SystemExit('Android Gradle-Datei fehlt')

          s = p.read_text()
          s, count = re.subn(
              r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)',
              'compileSdk = 36',
              s
          )

          if count == 0:
              raise SystemExit('compileSdk-Einstellung nicht gefunden')

          p.write_text(s)
          print('App compileSdk auf 36 eingestellt')
          PY

      - name: Kamera und Internet Berechtigungen eintragen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          for permission in (
              'android.permission.CAMERA',
              'android.permission.INTERNET'
          ):
              if permission not in s:
                  pos = s.index('>', s.index('<manifest')) + 1
                  s = (
                      s[:pos]
                      + f'\n    <uses-permission android:name="{permission}" />'
                      + s[pos:]
                  )

          p.write_text(s)
          PY

      - name: Abhaengigkeiten installieren
        run: flutter pub get

      - name: Android SDK 36 fuer file_picker einstellen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'

          files = list(root.glob('file_picker-*/android/build.gradle'))
          files += list(root.glob('file_picker-*/android/build.gradle.kts'))

          if not files:
              raise SystemExit('file_picker Gradle-Datei nicht gefunden')

          for p in files:
              s = p.read_text()

              if p.suffix == '.kts':
                  s, count = re.subn(
                      r'compileSdk\s*=\s*\d+',
                      'compileSdk = 36',
                      s
                  )
              else:
                  s, count = re.subn(
                      r'compileSdk(?:Version)?\s*(?:=\s*)?\d+',
                      'compileSdkVersion 36',
                      s
                  )

              if count == 0:
                  raise SystemExit(
                      f'compileSdk in {p} nicht gefunden'
                  )

              p.write_text(s)
              print(f'Android SDK 36 eingestellt: {p}')

          PY

      - name: APK erstellen
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: APK-Signatur vor Veroeffentlichung pruefen
        run: python3 scripts/verify_android_signing.py

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Optimizer-Android
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: APK als Release veroeffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 3D Print Optimizer Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Temporaere Signaturdateien entfernen
        if: always()
        shell: bash
        run: |
          rm -f -- android/key.properties
          rm -rf -- "${RUNNER_TEMP:?}/optimizer-android-signing"
