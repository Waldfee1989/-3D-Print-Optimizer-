name: Kobra S1 WLAN pruefen
on:
  push:
    branches: [kobra-s1-lan-upload]
  pull_request:
    branches: [main]
    paths: ['lib/kobra_lan.dart', 'lib/printer_send_page.dart', 'lib/slicer_page.dart', 'test/kobra_lan_test.dart', 'test/printer_send_page_test.dart', '.github/workflows/lan-upload.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lan-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/kobra_lan.dart lib/printer_send_page.dart lib/slicer_page.dart test/kobra_lan_test.dart test/printer_send_page_test.dart
      - run: flutter test test/kobra_lan_test.dart test/printer_send_page_test.dart test/gcode_preview_test.dart --reporter expanded
      - run: python3 -m unittest discover -s scripts/tests -v
