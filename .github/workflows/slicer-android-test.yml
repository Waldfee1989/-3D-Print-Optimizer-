name: Slicer auf Android pruefen
on:
  push:
    branches: [integrated-slicer]
    paths: ['lib/**','scripts/**','integration_test/**','test_driver/**','pubspec.yaml','.github/workflows/slicer-android-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android-Testengine bauen
        run: python3 scripts/build_slicer_engine.py --output build/slicer-x86 --android --abi x86_64
      - name: Test-App vorbereiten
        run: |
          flutter create . --platforms=android
          python3 scripts/configure_android_updates.py
          python3 scripts/configure_android_geometry.py
          python3 scripts/configure_android_slicer.py build/slicer-x86/liboptimizer_slicer.so x86_64
          flutter pub get
          python3 scripts/configure_android_sdk.py
      - name: KVM bereitstellen
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Slicer in installierter Android-App ausfuehren
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/local_slicer_device_test.dart -d emulator-5554
