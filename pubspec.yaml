name: print_optimizer
description: Personal 3D print optimizer
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  image_picker: ^1.2.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  mobile_scanner: ^7.4.2
  crypto: ^3.0.8
  archive: ^3.6.1
  xml: ^6.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/Manifold.txt
    - assets/licenses/CuraEngine.txt
    - assets/licenses/Cura.txt
    - assets/licenses/GPL-3.0.txt
    - assets/licenses/CuraEngine-Clipper.txt
    - assets/licenses/CuraEngine-RapidJSON.txt
    - assets/licenses/CuraEngine-stb.txt
    - assets/slicer/defaults.json


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
